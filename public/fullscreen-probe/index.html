<!doctype html>
<!--
  PROTOTYPE: throwaway fullscreen probe (landscape ticket 04).
  Answers: inside the Amazon Kids web wrapper on a Fire HD 8, can a page go
  fullscreen (hiding the Kids top bar), how do you get out, and can it lock
  landscape once fullscreen? Delete public/fullscreen-probe/ once ticket 04 is answered.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Fullscreen probe (prototype)</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font: 18px/1.35 system-ui, sans-serif;
        background: #2b2b40;
        color: #fff;
        /* A bright edge so you can see exactly where the page stops. */
        box-shadow: inset 0 0 0 6px #ff4fa3;
        box-sizing: border-box;
        padding: 14px;
        overflow: auto;
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .note { color: #c9c9e0; margin: 0 0 10px; font-size: 15px; }
      .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
      button, a.btn {
        font: inherit; font-weight: 700; border: 0; border-radius: 12px;
        padding: 14px 18px; background: #ffd23f; color: #222; text-decoration: none;
      }
      button.alt, a.btn.alt { background: #7ed957; }
      button.grey { background: #c9c9e0; }
      .cols { display: flex; flex-wrap: wrap; gap: 12px; }
      .card { background: #3a3a55; border-radius: 12px; padding: 10px 12px; flex: 1 1 320px; }
      .card h2 { font-size: 16px; margin: 0 0 6px; color: #ffd23f; }
      table { border-collapse: collapse; width: 100%; font-size: 15px; }
      td { padding: 2px 6px; vertical-align: top; }
      td:first-child { color: #c9c9e0; white-space: nowrap; }
      .yes { color: #7ed957; font-weight: 700; }
      .no { color: #ff7b7b; font-weight: 700; }
      #log { font: 14px/1.3 ui-monospace, monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
      #ua { font-size: 12px; color: #c9c9e0; word-break: break-all; }
      /* Corner home button mock: semi-transparent, like the one the game would get. */
      #home {
        position: fixed; top: 12px; right: 12px; width: 56px; height: 56px;
        border-radius: 50%; background: rgba(255, 255, 255, 0.35); color: #222;
        display: grid; place-items: center; font-size: 28px; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <a id="home" href="https://trevordobrinska.github.io/" title="Back to the Arcade">⌂</a>
    <h1>Fullscreen probe <small>(prototype, throwaway)</small></h1>
    <p class="note">Pink edge = where this page ends. Tap a button, then read the "Now" card and the log.</p>

    <div class="buttons">
      <button id="fs">1. Go fullscreen</button>
      <button id="fsLock">2. Fullscreen + lock landscape</button>
      <button id="lock" class="alt">3. Lock landscape (no fullscreen)</button>
      <button id="exit" class="grey">Exit fullscreen</button>
      <button id="unlock" class="grey">Unlock</button>
      <a class="btn alt" href="../">Open the game</a>
      <a class="btn alt" href="https://trevordobrinska.github.io/">Back to Arcade</a>
    </div>

    <div class="cols">
      <div class="card">
        <h2>Now</h2>
        <table id="state"></table>
      </div>
      <div class="card">
        <h2>Log</h2>
        <div id="log"></div>
      </div>
    </div>
    <p id="ua"></p>

    <script>
      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      const t0 = performance.now();
      function log(msg) {
        const s = ((performance.now() - t0) / 1000).toFixed(1).padStart(6);
        logEl.textContent = `${s}s  ${msg}\n` + logEl.textContent;
      }
      const yn = (v) => (v ? '<span class="yes">yes</span>' : '<span class="no">no</span>');
      const err = (e) => `${e && e.name ? e.name : "Error"}: ${e && e.message ? e.message : e}`;

      function fsElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }
      function render() {
        const so = screen.orientation;
        const mq = (q) => matchMedia(q).matches;
        const rows = [
          ["Fullscreen now", yn(!!fsElement())],
          ["fullscreenEnabled", yn(document.fullscreenEnabled) + " / webkit " + yn(document.webkitFullscreenEnabled)],
          ["requestFullscreen exists", yn(!!document.documentElement.requestFullscreen) + " / webkit " + yn(!!document.documentElement.webkitRequestFullscreen)],
          ["orientation.lock exists", yn(!!(so && so.lock))],
          ["Page size (inner)", `${innerWidth} × ${innerHeight}`],
          ["Page size (clientW/H)", `${document.documentElement.clientWidth} × ${document.documentElement.clientHeight}`],
          ["Screen size", `${screen.width} × ${screen.height} (avail ${screen.availWidth} × ${screen.availHeight})`],
          ["Top bar eats (screen − page)", `${Math.max(screen.width, screen.height) - Math.max(innerWidth, innerHeight)} / ${Math.min(screen.width, screen.height) - Math.min(innerWidth, innerHeight)} px (long / short side)`],
          ["Device pixel ratio", devicePixelRatio],
          ["Orientation", so ? `${so.type}, ${so.angle}°` : String(window.orientation)],
          ["display-mode", ["fullscreen", "standalone", "minimal-ui", "browser"].filter((m) => mq(`(display-mode: ${m})`)).join(", ") || "none"],
          ["In a frame?", yn(window.top !== window.self)],
        ];
        $("state").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
      }

      async function goFullscreen() {
        const el = document.documentElement;
        try {
          if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: "hide" });
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          else { log("FULLSCREEN: no API at all"); return false; }
          log("FULLSCREEN: request resolved");
          return true;
        } catch (e) {
          log("FULLSCREEN: refused — " + err(e));
          return false;
        }
      }
      async function lockLandscape() {
        try {
          if (!screen.orientation || !screen.orientation.lock) { log("LOCK: no API"); return; }
          await screen.orientation.lock("landscape");
          log("LOCK: landscape lock resolved");
        } catch (e) {
          log("LOCK: refused — " + err(e));
        }
      }

      $("fs").onclick = goFullscreen;
      $("fsLock").onclick = async () => { if (await goFullscreen()) await lockLandscape(); };
      $("lock").onclick = lockLandscape;
      $("exit").onclick = async () => {
        try {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          log("EXIT: resolved");
        } catch (e) { log("EXIT: " + err(e)); }
      };
      $("unlock").onclick = () => {
        try { screen.orientation.unlock(); log("UNLOCK: done"); } catch (e) { log("UNLOCK: " + err(e)); }
      };

      for (const ev of ["fullscreenchange", "webkitfullscreenchange"])
        document.addEventListener(ev, () => { log(`${ev}: now ${fsElement() ? "FULLSCREEN" : "not fullscreen"}`); render(); });
      for (const ev of ["fullscreenerror", "webkitfullscreenerror"])
        document.addEventListener(ev, () => log(`${ev} fired`));
      addEventListener("resize", () => { log(`resize → ${innerWidth} × ${innerHeight}`); render(); });
      if (screen.orientation) screen.orientation.addEventListener("change", () => { log(`orientation → ${screen.orientation.type}`); render(); });
      document.addEventListener("visibilitychange", () => log(`visibility → ${document.visibilityState}`));

      $("ua").textContent = navigator.userAgent;
      render();
      log("loaded");
    </script>
  </body>
</html>
