<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8e7" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/night1/manifest.webmanifest" />
    <link rel="icon" href="/night1/icon-192.png" />
    <title>Doodle Monsters: Night 1 test</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px 20px 48px;
        font: 18px/1.4 system-ui, sans-serif;
        background: #fff8e7;
        color: #2b2b40;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 26px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .sub {
        margin: 0 0 16px;
        color: #666;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 14px;
      }
      section {
        background: #fff;
        border: 2px solid #e6dcc3;
        border-radius: 14px;
        padding: 14px;
      }
      section.wide {
        grid-column: 1 / -1;
      }
      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .badge {
        flex: none;
        padding: 4px 12px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 16px;
        color: #fff;
        background: #999;
      }
      .badge.pass {
        background: #2e9d4b;
      }
      .badge.fail {
        background: #d23c3c;
      }
      .badge.pending {
        background: #c99a1c;
      }
      .detail {
        margin: 6px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      button,
      input[type="url"] {
        font: inherit;
        padding: 10px 16px;
        border-radius: 10px;
        border: 2px solid #2b2b40;
        background: #fff;
        color: #2b2b40;
      }
      button {
        cursor: pointer;
      }
      button:active {
        background: #eee;
      }
      button.yes {
        border-color: #2e9d4b;
        color: #2e9d4b;
      }
      button.no {
        border-color: #d23c3c;
        color: #d23c3c;
      }
      input[type="file"] {
        font: inherit;
        padding: 8px 0;
      }
      input[type="url"] {
        flex: 1;
        min-width: 200px;
      }
      pre {
        max-height: 180px;
        overflow: auto;
        background: #f5f1e6;
        padding: 8px;
        border-radius: 8px;
        font-size: 14px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #pad {
        display: block;
        width: 100%;
        height: 360px;
        margin-top: 10px;
        border: 2px dashed #c9bd9e;
        border-radius: 10px;
        background: #fff;
        touch-action: none;
      }
      code {
        background: #f5f1e6;
        padding: 1px 5px;
        border-radius: 5px;
      }
      ol {
        margin: 6px 0 0;
        padding-left: 22px;
      }
    </style>
  </head>
  <body>
    <h1>Doodle Monsters: Night 1 test</h1>
    <p class="sub">
      A throwaway page that checks what an Amazon Kids profile allows. It isn't part of the game.
      Green means pass, red means fail, yellow means waiting for you.
    </p>
    <div class="grid" id="checks"></div>
    <script type="module" src="/src/night1/main.ts"></script>
  </body>
</html>
