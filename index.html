<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff8e7" />
    <title>Doodle Monsters</title>
    <!-- No favicon yet; this stops the browser asking for one (and logging a 404). -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2b2b40;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      [hidden] {
        display: none !important;
      }

      /* Drawing screen (ticket 06) */
      #draw-screen {
        position: fixed;
        inset: 0;
        font-family: sans-serif;
      }
      #draw-screen button {
        font: bold 18px sans-serif;
        color: #2b2b40;
        border: 3px solid #2b2b40;
        border-radius: 14px;
        background: #ffffff;
        touch-action: manipulation;
      }
      #draw-screen button:disabled {
        opacity: 0.35;
      }
      #draw-screen .toolbar {
        position: absolute;
        top: 8px;
        left: 8px;
        bottom: 8px;
        width: 116px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
        border-radius: 20px;
        background: rgba(255, 248, 231, 0.92);
        border: 3px solid #2b2b40;
        overflow-y: auto;
      }
      #draw-screen .colors {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #draw-screen .swatch {
        aspect-ratio: 1;
        border-radius: 50%;
      }
      #draw-screen .swatch.chosen,
      #draw-screen .brush.chosen {
        outline: 4px solid #ff8c42;
        outline-offset: 2px;
      }
      #draw-screen .brushes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #draw-screen .brush {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #draw-screen .brush span {
        display: block;
        border-radius: 50%;
      }
      #draw-screen .tool {
        padding: 10px 4px;
      }
      #draw-screen .start-over {
        margin-top: auto;
      }
      #draw-screen .start-over.confirming {
        background: #ffd23f;
      }
      #draw-screen .done {
        position: absolute;
        right: 16px;
        bottom: 16px;
        padding: 16px 32px;
        font-size: 28px;
        background: #7ed957;
        border-width: 4px;
        border-radius: 20px;
      }

      /* Bring to life screen (ticket 07) */
      #bring-to-life {
        position: fixed;
        inset: 0;
        display: flex;
        font-family: sans-serif;
        color: #2b2b40;
        background: #fff8e7;
      }
      #bring-to-life .stage {
        position: relative;
        flex: 1;
        min-width: 0;
        background: radial-gradient(circle, #ffffff 0%, #fff8e7 70%);
      }
      #bring-to-life .stage canvas {
        width: 100%;
        height: 100%;
      }
      #bring-to-life .hint {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        text-align: center;
        font: bold 20px sans-serif;
        pointer-events: none;
      }
      #bring-to-life .hint b {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 10px;
        border-radius: 12px;
        background: #ffd23f;
      }
      #bring-to-life .hint.shake {
        animation: shake 0.4s;
      }
      @keyframes shake {
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
      }
      #bring-to-life .panel {
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        box-sizing: border-box;
        border-left: 3px solid #2b2b40;
        background: #ffeccc;
        overflow-y: auto;
      }
      #bring-to-life .label {
        font: bold 18px sans-serif;
      }
      #bring-to-life button {
        font: bold 18px sans-serif;
        color: #2b2b40;
        border: 3px solid #2b2b40;
        border-radius: 14px;
        background: #ffffff;
        touch-action: manipulation;
      }
      #bring-to-life button:disabled {
        opacity: 0.35;
      }
      #bring-to-life .name-row {
        display: flex;
        gap: 8px;
      }
      #bring-to-life .name {
        flex: 1;
        min-width: 0;
        font: bold 22px sans-serif;
        color: #2b2b40;
        padding: 8px 10px;
        border: 3px solid #2b2b40;
        border-radius: 14px;
        user-select: text;
        -webkit-user-select: text;
      }
      #bring-to-life .reroll {
        width: 56px;
        font-size: 28px;
        padding: 0;
      }
      #bring-to-life .reroll.rolling {
        animation: roll 0.4s;
      }
      @keyframes roll {
        to { transform: rotate(360deg); }
      }
      #bring-to-life .temperaments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #bring-to-life .temperament {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
      }
      #bring-to-life .temperament .icon {
        font-size: 30px;
      }
      #bring-to-life .temperament.chosen {
        background: #ffd23f;
        outline: 4px solid #ff8c42;
        outline-offset: 2px;
      }
      #bring-to-life .start {
        margin-top: auto;
        padding: 14px;
        font-size: 26px;
        background: #7ed957;
        border-width: 4px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="draw-screen" hidden></div>
    <div id="bring-to-life" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
