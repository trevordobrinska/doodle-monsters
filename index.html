<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff8e7" />
    <title>Doodle Monsters</title>
    <!-- No favicon yet; this stops the browser asking for one (and logging a 404). -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2b2b40;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      [hidden] {
        display: none !important;
      }

      /* Drawing screen (ticket 06) */
      #draw-screen {
        position: fixed;
        inset: 0;
        font-family: sans-serif;
      }
      #draw-screen button {
        font: bold 18px sans-serif;
        color: #2b2b40;
        border: 3px solid #2b2b40;
        border-radius: 14px;
        background: #ffffff;
        touch-action: manipulation;
      }
      #draw-screen button:disabled {
        opacity: 0.35;
      }
      #draw-screen .toolbar {
        position: absolute;
        top: 8px;
        left: 8px;
        bottom: 8px;
        width: 116px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
        border-radius: 20px;
        background: rgba(255, 248, 231, 0.92);
        border: 3px solid #2b2b40;
        overflow-y: auto;
      }
      #draw-screen .colors {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #draw-screen .swatch {
        aspect-ratio: 1;
        border-radius: 50%;
      }
      #draw-screen .swatch.chosen,
      #draw-screen .brush.chosen {
        outline: 4px solid #ff8c42;
        outline-offset: 2px;
      }
      #draw-screen .brushes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #draw-screen .brush {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #draw-screen .brush span {
        display: block;
        border-radius: 50%;
      }
      #draw-screen .tool {
        padding: 10px 4px;
      }
      #draw-screen .start-over {
        margin-top: auto;
      }
      #draw-screen .start-over.confirming {
        background: #ffd23f;
      }
      #draw-screen .done {
        position: absolute;
        right: 16px;
        bottom: 16px;
        padding: 16px 32px;
        font-size: 28px;
        background: #7ed957;
        border-width: 4px;
        border-radius: 20px;
      }

      /* Bring to life screen (ticket 07) */
      #bring-to-life {
        position: fixed;
        inset: 0;
        display: flex;
        font-family: sans-serif;
        color: #2b2b40;
        background: #fff8e7;
      }
      #bring-to-life .stage {
        position: relative;
        flex: 1;
        min-width: 0;
        background: radial-gradient(circle, #ffffff 0%, #fff8e7 70%);
      }
      #bring-to-life .stage canvas {
        width: 100%;
        height: 100%;
      }
      #bring-to-life .hint {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        text-align: center;
        font: bold 20px sans-serif;
        pointer-events: none;
      }
      #bring-to-life .hint b {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 10px;
        border-radius: 12px;
        background: #ffd23f;
      }
      #bring-to-life .hint.shake {
        animation: shake 0.4s;
      }
      @keyframes shake {
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
      }
      #bring-to-life .panel {
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        box-sizing: border-box;
        border-left: 3px solid #2b2b40;
        background: #ffeccc;
        overflow-y: auto;
      }
      #bring-to-life .label {
        font: bold 18px sans-serif;
      }
      #bring-to-life button {
        font: bold 18px sans-serif;
        color: #2b2b40;
        border: 3px solid #2b2b40;
        border-radius: 14px;
        background: #ffffff;
        touch-action: manipulation;
      }
      #bring-to-life button:disabled {
        opacity: 0.35;
      }
      #bring-to-life .name-row {
        display: flex;
        gap: 8px;
      }
      #bring-to-life .name {
        flex: 1;
        min-width: 0;
        font: bold 22px sans-serif;
        color: #2b2b40;
        padding: 8px 10px;
        border: 3px solid #2b2b40;
        border-radius: 14px;
        user-select: text;
        -webkit-user-select: text;
      }
      #bring-to-life .reroll {
        width: 56px;
        font-size: 28px;
        padding: 0;
      }
      #bring-to-life .reroll.rolling {
        animation: roll 0.4s;
      }
      @keyframes roll {
        to { transform: rotate(360deg); }
      }
      #bring-to-life .temperaments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #bring-to-life .temperament {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
      }
      #bring-to-life .temperament .icon {
        font-size: 30px;
      }
      #bring-to-life .temperament.chosen {
        background: #ffd23f;
        outline: 4px solid #ff8c42;
        outline-offset: 2px;
      }
      #bring-to-life .hard-mode {
        padding: 10px 4px;
      }
      #bring-to-life .hard-mode.on {
        color: #ffffff;
        background: #e8505b;
      }
      #bring-to-life .start {
        margin-top: auto;
        padding: 14px;
        font-size: 26px;
        background: #7ed957;
        border-width: 4px;
        border-radius: 20px;
      }

      /* Zoo (ticket 09) */
      #zoo {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: sans-serif;
        color: #2b2b40;
      }
      #zoo .draw {
        position: absolute;
        right: 24px;
        bottom: 24px;
        padding: 20px 36px;
        font: bold 32px sans-serif;
        color: #2b2b40;
        background: #ffd23f;
        border: 4px solid #2b2b40;
        border-radius: 24px;
        box-shadow: 0 6px 0 #2b2b40;
        pointer-events: auto;
        touch-action: manipulation;
      }
      #zoo .draw:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #2b2b40;
      }
      #zoo .first-time {
        position: absolute;
        right: 100px;
        bottom: 130px;
        display: flex;
        flex-direction: column;
        align-items: center;
        font: bold 26px sans-serif;
        animation: point 0.9s ease-in-out infinite alternate;
      }
      #zoo .first-time .arrow {
        font-size: 72px;
        line-height: 1;
      }
      @keyframes point {
        to { transform: translateY(18px); }
      }
      /* Several Habitats (ticket 12) */
      #zoo .habitat-arrow {
        position: absolute;
        top: 50%;
        width: 96px;
        height: 96px;
        margin-top: -48px;
        font: bold 48px sans-serif;
        line-height: 1;
        color: #2b2b40;
        background: rgba(255, 255, 255, 0.85);
        border: 4px solid #2b2b40;
        border-radius: 50%;
        box-shadow: 0 6px 0 #2b2b40;
        pointer-events: auto;
        touch-action: manipulation;
      }
      #zoo .habitat-arrow:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #2b2b40;
      }
      #zoo .habitat-arrow.previous { left: 16px; }
      #zoo .habitat-arrow.next { right: 16px; }
      #zoo .habitat-dots {
        position: absolute;
        top: 20px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 14px;
      }
      #zoo .habitat-dots span {
        width: 22px;
        height: 22px;
        border: 3px solid #2b2b40;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
      }
      #zoo .habitat-dots span.shown {
        background: #ffd23f;
        transform: scale(1.3);
      }
      /* Name Card (ticket 11) */
      #name-card {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(43, 43, 64, 0.45);
        font-family: sans-serif;
        color: #2b2b40;
      }
      #name-card .card {
        position: relative;
        display: flex;
        gap: 24px;
        align-items: center;
        max-width: min(900px, 92vw);
        max-height: 90vh;
        padding: 24px 28px;
        box-sizing: border-box;
        background: #fff8e7;
        border: 4px solid #2b2b40;
        border-radius: 28px;
        box-shadow: 0 8px 0 #2b2b40;
        animation: card-in 0.25s ease-out;
      }
      @keyframes card-in {
        from { transform: scale(0.8); opacity: 0; }
      }
      #name-card .picture {
        flex: none;
        width: 280px;
        height: 280px;
        border-radius: 20px;
        background: radial-gradient(circle, #ffffff 0%, #ffeccc 75%);
      }
      #name-card .details {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        max-width: 420px;
        overflow-y: auto;
      }
      #name-card .name {
        margin: 0 40px 0 0;
        font-size: 34px;
        overflow-wrap: anywhere;
      }
      #name-card .drawn {
        font-size: 18px;
        opacity: 0.7;
      }
      #name-card .temperament {
        align-self: flex-start;
        padding: 4px 14px;
        font: bold 20px sans-serif;
        background: #ffd23f;
        border-radius: 14px;
      }
      #name-card .bio {
        margin: 6px 0;
        font-size: 21px;
        line-height: 1.4;
      }
      #name-card button {
        font: bold 20px sans-serif;
        color: #2b2b40;
        border: 3px solid #2b2b40;
        border-radius: 14px;
        background: #ffffff;
        touch-action: manipulation;
      }
      #name-card .close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 52px;
        height: 52px;
        padding: 0;
        font-size: 24px;
      }
      #name-card .goodbye {
        position: relative;
        overflow: hidden;
        align-self: flex-start;
        padding: 12px 22px;
        touch-action: none;
      }
      #name-card .goodbye .fill {
        position: absolute;
        inset: 0;
        background: #ffb3c7;
        transform: scaleX(0);
        transform-origin: left;
        transition-property: transform;
        transition-timing-function: linear;
      }
      /* Letting go early snaps it back at once. */
      #name-card .goodbye:not(.holding) .fill {
        transition-duration: 0s !important;
      }
      #name-card .goodbye.holding .fill {
        transform: scaleX(1);
      }
      #name-card .goodbye .label {
        position: relative;
      }
      #name-card .goodbye-hint {
        font-size: 15px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="draw-screen" hidden></div>
    <div id="bring-to-life" hidden></div>
    <div id="zoo" hidden>
      <div class="first-time" hidden>
        <span>Draw your first Monster!</span>
        <span class="arrow">👇</span>
      </div>
      <div class="habitat-dots" hidden></div>
      <button class="habitat-arrow previous" aria-label="Previous Habitat" hidden>◀</button>
      <button class="habitat-arrow next" aria-label="Next Habitat" hidden>▶</button>
      <button class="draw">✏️ Draw a Monster!</button>
    </div>
    <div id="name-card" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
